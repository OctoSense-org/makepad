name: Windows D3D11 renderer
on:
  push:
    branches: [windows-warp-fallback]
  pull_request:
    paths:
      - 'platform/src/os/windows/d3d11.rs'
      - '.github/workflows/windows-renderer.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-windows:
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        working-directory: makepad
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: makepad
      - uses: actions/checkout@v4
        with:
          repository: OctoSense-org/Octoscript-Makepad
          ref: 6cf2d90aa33ff4ae603f49c7557f3ecf986207f0
          path: octoscript-makepad
          persist-credentials: false
      - run: rustup toolchain install 1.98.0 --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: makepad -> target
      - name: Check the native Windows platform
        env:
          RUSTUP_TOOLCHAIN: 1.98.0
        run: cargo check -p makepad-platform --all-targets
      - name: Run existing native platform tests
        env:
          RUSTUP_TOOLCHAIN: 1.98.0
        run: cargo test -p makepad-platform --lib
      - name: Build existing native example in release mode
        env:
          RUSTUP_TOOLCHAIN: 1.98.0
        run: cargo build --release -p makepad-example-hello-world
      - name: Exercise the existing example on native Windows WARP
        shell: pwsh
        timeout-minutes: 5
        env:
          MAKEPAD_D3D11_WARP: '1'
        run: |
          $ErrorActionPreference='Stop'
          $sample=Join-Path $PWD 'local/agent_state/windows-warp-native'
          New-Item -ItemType Directory -Path $sample -Force | Out-Null
          $owned=Start-Process -FilePath (Join-Path $PWD 'target/release/makepad-example-hello-world.exe') -ArgumentList '--remote=8680' -WorkingDirectory $PWD -WindowStyle Normal -RedirectStandardOutput (Join-Path $sample 'stdout.log') -RedirectStandardError (Join-Path $sample 'stderr.log') -PassThru
          try {
            $ready=$false
            for($attempt=0;$attempt -lt 45;$attempt++){
              if($owned.HasExited){throw 'Owned example exited during startup'}
              try {
                $state=Invoke-RestMethod 'http://127.0.0.1:8680/s' -TimeoutSec 2
                if($state.w.Count -gt 0){$ready=$true;break}
              } catch {}
              Start-Sleep -Milliseconds 500
            }
            if(!$ready){throw 'Native example remote endpoint did not become ready'}
            $tree=Invoke-RestMethod 'http://127.0.0.1:8680/snap?all=1' -TimeoutSec 10
            if(!($tree.s | Where-Object {$_.t -eq 'Hello GIF'})){throw 'Existing example widget tree was not rendered'}
            $frame=Join-Path $sample 'native-warp.png'
            Add-Type -AssemblyName System.Drawing
            $drawn=$false
            for($capture=0;$capture -lt 4;$capture++){
              $candidate=Join-Path $sample ("native-warp-"+$capture+".png")
              Invoke-WebRequest 'http://127.0.0.1:8680/g?raw=1' -OutFile $candidate -TimeoutSec 30
              $image=[Drawing.Bitmap]::new($candidate)
              try {
                if($image.Width -lt 200 -or $image.Height -lt 150){throw 'Native frame dimensions invalid'}
                $colors=[Collections.Generic.HashSet[int]]::new()
                for($y=0;$y -lt $image.Height;$y+=8){for($x=0;$x -lt $image.Width;$x+=8){[void]$colors.Add($image.GetPixel($x,$y).ToArgb())}}
                Write-Output ('Native WARP frame '+$capture+': '+$image.Width+'x'+$image.Height+', sampled colors='+$colors.Count)
                if($colors.Count -ge 8){Copy-Item -LiteralPath $candidate -Destination $frame;$drawn=$true;break}
              } finally {$image.Dispose()}
              Start-Sleep -Seconds 1
            }
            if(!$drawn){throw 'Native frame stayed blank through bounded startup checks'}
            $observed=(Get-Content (Join-Path $sample 'stdout.log') -Raw)+(Get-Content (Join-Path $sample 'stderr.log') -Raw)
            if($observed -notmatch 'using Windows WARP software rendering'){throw 'Native WARP path was not observed'}
            Get-FileHash -LiteralPath $frame -Algorithm SHA256 | Format-List
          } finally {
            if(!$owned.HasExited){try {Invoke-WebRequest 'http://127.0.0.1:8680/quit' -TimeoutSec 10 | Out-Null} catch {};if(!$owned.WaitForExit(20000)){Stop-Process -Id $owned.Id;throw 'Owned example did not exit gracefully'}}
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-warp-native-frame
          path: makepad/local/agent_state/windows-warp-native/
          if-no-files-found: error
