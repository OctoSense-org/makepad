name: Windows WebView2 smoke
on:
  push:
    branches: [codex/windows-webview-ci-20261104]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Build and run against the installed WebView2 runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git clone --no-checkout https://github.com/OctoSense-org/makepad.git makepad
          if ($LASTEXITCODE -ne 0) { throw 'Makepad clone failed' }
          git -C makepad fetch --depth 1 origin $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Makepad revision fetch failed' }
          git -C makepad checkout --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Makepad checkout failed' }
          git clone --no-checkout https://github.com/OctoSense-org/Octoscript-Makepad.git octoscript-makepad
          if ($LASTEXITCODE -ne 0) { throw 'Octoscript clone failed' }
          git -C octoscript-makepad fetch --depth 1 origin 78f90f6e9e5e3b9fe4b5f5b0618fa4e93db30860
          if ($LASTEXITCODE -ne 0) { throw 'Octoscript revision fetch failed' }
          git -C octoscript-makepad checkout --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Octoscript checkout failed' }
          rustup toolchain list
          rustup run stable rustc --version
          if ($LASTEXITCODE -ne 0) { throw 'No preinstalled stable Rust toolchain' }
          rustup run stable cargo build --release --manifest-path makepad/.github/windows-webview-probe/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw 'Windows WebView2 probe did not build' }
          $exe = Join-Path $pwd 'makepad/.github/windows-webview-probe/target/release/makepad-webview2-smoke.exe'
          $stdout = Join-Path $pwd 'webview-probe.stdout'
          $stderr = Join-Path $pwd 'webview-probe.stderr'
          $env:MAKEPAD_HIDE_WINDOWS = '1'
          $process = Start-Process -FilePath $exe -ArgumentList '--remote' -WorkingDirectory (Join-Path $pwd 'makepad') -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
          $end = [DateTime]::UtcNow.AddSeconds(75)
          $content = ''
          $errors = ''
          while ([DateTime]::UtcNow -lt $end -and -not $process.HasExited) {
            if (Test-Path $stdout) { $content = Get-Content $stdout -Raw }
            if (Test-Path $stderr) { $errors = Get-Content $stderr -Raw }
            if (($content -match 'WV2_PASS') -or ($errors -match 'WV2_FAIL')) { break }
            Start-Sleep -Seconds 2
            $process.Refresh()
          }
          if ($content -match 'listening on 127\.0\.0\.1:(\d+)') {
            try { Invoke-WebRequest -UseBasicParsing -TimeoutSec 5 "http://127.0.0.1:$($Matches[1])/quit" | Out-Null } catch { Write-Output "Graceful quit failed: $_" }
          }
          if (-not $process.WaitForExit(5000)) { Stop-Process -Id $process.Id -Force }
          if (Test-Path $stdout) { Get-Content $stdout }
          if (Test-Path $stderr) { Get-Content $stderr }
          if ($content -notmatch 'WV2_PASS') { throw 'WebView2 window, navigation, or reparenting did not pass' }
