[package]
name = "makepad-example-material-catalog"
version = "0.1.0"
edition = "2021"
description = "A Material-Design component catalog authored in Splash DSL, rendered as makepad native widgets at runtime, with on-device hot reload"

[dependencies]
makepad-widgets = { path = "../../widgets", version = "2.0.0" }
# Runtime Splash-DSL pipeline (see splash_runtime): the [patch] in the workspace
# root points these at this repo's local makepad-script, one shared VM.
splash-render = { path = "~/home/Splash-OH-render/crates/splash-render" }
splash-makepad = { path = "~/home/Splash-OH-render/crates/splash-makepad" }

[[bin]]
name = "makepad-example-material-catalog"
path = "src/main.rs"
