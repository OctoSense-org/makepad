[package]
name = "makepad-example-aichat"
version = "0.1.0"
authors = ["Makepad <info@makepad.nl>"]
edition = "2021"
description = "AI Chat example demonstrating makepad-ai library"
license = "MIT OR Apache-2.0"

# Mobile targets: `cargo makepad {android,ohos} build` compiles the app as a
# cdylib (`cargo rustc --lib --crate-type=cdylib`), where `app_main!` emits the
# platform entrypoints instead of `fn main`. Without a lib target that build
# fails with "no library targets found in package". Mirrors octos-one's
# app/app/Cargo.toml.
[lib]
name = "makepad_example_aichat"
path = "src/main.rs"

[dependencies]
makepad-widgets = { path = "../../widgets", features = ["maps", "pdf"] }
makepad-code-editor = { path = "../../code_editor" }
makepad-ai = { path = "../../libs/makepad_ai" }
streaming-markdown-kit = { git = "https://github.com/Project-Robius-China/streaming-markdown-kit.git", branch = "main", features = ["mermaid"] }

# Inline-diagram renderer. The `makepad` feature pulls in the Makepad-native
# `DiagramView` widget that turns a ```diagram-fenced JSON body into a
# painted pyramid/tree/flowchart/layers/quadrant.
makepad-diagram-kit = { git = "https://github.com/Project-Robius-China/makepad-diagram-kit.git", branch = "main", features = ["makepad"] }

# Cross-platform URL opener. std::process::Command only works on desktop —
# iOS/Android/WASM need platform-specific plumbing (UIApplication, Intent,
# window.open). robius-open is the Robius-ecosystem standard for this
# (used by robrix and moly).
robius-open = { git = "https://github.com/project-robius/robius" }
